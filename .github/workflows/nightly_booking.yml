name: Nightly Room Booking

on:
  # Primary trigger: the scheduler's Vercel cron starts this via workflow_dispatch
  # around 05:00 UTC (midnight-1am Ottawa). GitHub's own schedule below is only a
  # backup: it was switched off after 60 days without commits and, before that,
  # ran 6-9 hours late. Whichever starts first claims the date; the other exits.
  schedule:
    - cron: '01 05 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Book for this date (YYYY-MM-DD, within the next 7 days). Empty = one week from today.'
        required: false
        default: ''
      source:
        description: 'What started this run (set by the scheduler).'
        required: false
        default: 'manual'

jobs:
  book-room:
    runs-on: ubuntu-latest

    env:
      # Scheduler web app. Override with a repository variable if it moves.
      BOOKING_CONFIG_URL: ${{ vars.BOOKING_CONFIG_URL || 'https://room-booking-scheduler.vercel.app' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Work out the target date and claim it
        id: claim
        env:
          BOOKING_SYNC_TOKEN: ${{ secrets.BOOKING_SYNC_TOKEN }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          SOURCE: ${{ github.event.inputs.source || github.event_name }}
        run: |
          # One week from today in Ottawa time, unless a date was given.
          if [ -n "$INPUT_DATE" ]; then TARGET="$INPUT_DATE"; FORCE=true; else TARGET=$(TZ=America/Toronto date -d '+7 days' +%F); FORCE=false; fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Target date: $TARGET (started by: $SOURCE)"

          if [ -z "$BOOKING_SYNC_TOKEN" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          CODE=$(curl -sS -o claim.json -w '%{http_code}' --max-time 30 -X POST "$BOOKING_CONFIG_URL/api/runs/claim" \
            -H "Authorization: Bearer $BOOKING_SYNC_TOKEN" -H 'Content-Type: application/json' \
            -d "{\"targetDate\":\"$TARGET\",\"force\":$FORCE,\"source\":\"$SOURCE\"}" || true)
          if [ "$CODE" = "409" ]; then
            echo "::notice::Skipping: $(jq -r .reason claim.json) ($TARGET)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            # Any other failure to reach the ledger: book anyway (per-profile guard still prevents double bookings).
            [ "$CODE" = "200" ] || echo "::warning::Could not claim $TARGET (HTTP $CODE); continuing."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.claim.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Catches slot-matching regressions before a browser is ever launched.
      - name: Run unit tests
        if: steps.claim.outputs.skip != 'true'
        run: mvn -B test

      - name: Build Docker Image
        if: steps.claim.outputs.skip != 'true'
        run: docker build -t roombooking .

      - name: Run Container & Trigger Booking
        if: steps.claim.outputs.skip != 'true'
        env:
          BOOKING_TARGET_DATE: ${{ steps.claim.outputs.target }}
          BOOKING_SYNC_TOKEN: ${{ secrets.BOOKING_SYNC_TOKEN }}
          # Only used when BOOKING_SYNC_TOKEN is missing (single-profile fallback).
          BOOKING_USERNAME: ${{ secrets.BOOKING_USERNAME }}
          BOOKING_PASSWORD: ${{ secrets.BOOKING_PASSWORD }}
        run: |
          if [ -n "$BOOKING_SYNC_TOKEN" ]; then
            echo "Using schedules from $BOOKING_CONFIG_URL"
            CONFIG_ARGS="-e BOOKING_CONFIG_URL=$BOOKING_CONFIG_URL -e BOOKING_SYNC_TOKEN"
          elif [ -n "$BOOKING_USERNAME" ] && [ -n "$BOOKING_PASSWORD" ]; then
            echo "::warning::BOOKING_SYNC_TOKEN is not set; falling back to the bundled default schedule."
            CONFIG_ARGS="-e BOOKING_USERNAME -e BOOKING_PASSWORD"
          else
            echo "::error::Set the BOOKING_SYNC_TOKEN secret (or BOOKING_USERNAME / BOOKING_PASSWORD)."
            exit 1
          fi

          # shellcheck disable=SC2086
          docker run -d --name booking-service -p 8080:8080 -e BOOKING_TARGET_DATE $CONFIG_ARGS roombooking

          echo "Waiting for service to start..."
          READY=""
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/api/v1/health > /dev/null; then READY=1; break; fi
            sleep 2
          done
          if [ -z "$READY" ]; then
            echo "::error::Service never became healthy on port 8080."
            echo "----- container logs -----"
            docker logs booking-service
            exit 1
          fi

          echo "Triggering booking process..."
          curl -sS --max-time 3000 -X POST http://localhost:8080/api/v1/book -o response.json || true
          if ! jq -e .overall response.json > /dev/null 2>&1; then
            echo "::error::Unrecognised response from booking service."
            cat response.json 2>/dev/null || true
            echo "----- container logs -----"
            docker logs booking-service
            exit 1
          fi

          jq -r '.results[].line' response.json
          jq -r '.results[] | select(.status=="UNAVAILABLE") | "::notice::\(.line)"' response.json
          jq -r '.results[] | select(.status=="FAILED") | "::error::\(.line)"' response.json

          # Report outcomes back so each person sees them in the scheduler.
          if [ -n "$BOOKING_SYNC_TOKEN" ]; then
            jq '{targetDate, results: [.results[] | {profileId, status, summary, detail}]}' response.json \
              | curl -sS --max-time 60 -X POST "$BOOKING_CONFIG_URL/api/results" \
                  -H "Authorization: Bearer $BOOKING_SYNC_TOKEN" -H 'Content-Type: application/json' \
                  --data @- || echo "::warning::Could not report results to the scheduler."
            echo
          fi

          if [ "$(jq -r .overall response.json)" = "FAILED" ]; then
            echo "----- container logs -----"
            docker logs booking-service
            exit 1
          fi
