name: Nightly Room Booking

on:
  schedule:
    # Runs at 05:01 UTC (approx 12:01 AM EST) on Mon, Wed, Thu, Fri.
    # Bookings are made 7 days out, so the run day matches the booked day.
    - cron: '01 05 * * 1,3,4,5'
  workflow_dispatch:
    # Allows manual trigger from GitHub UI

jobs:
  book-room:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Catches slot-matching regressions before a browser is ever launched.
      - name: Run unit tests
        run: mvn -B test

      - name: Build Docker Image
        run: docker build -t roombooking .

      - name: Run Container & Trigger Booking
        env:
          BOOKING_USERNAME: ${{ secrets.BOOKING_USERNAME }}
          BOOKING_PASSWORD: ${{ secrets.BOOKING_PASSWORD }}
        run: |
          if [ -z "$BOOKING_USERNAME" ] || [ -z "$BOOKING_PASSWORD" ]; then
            echo "::error::BOOKING_USERNAME / BOOKING_PASSWORD secrets are not set on this repository."
            exit 1
          fi

          docker run -d --name booking-service \
            -p 8080:8080 \
            -e BOOKING_USERNAME="$BOOKING_USERNAME" \
            -e BOOKING_PASSWORD="$BOOKING_PASSWORD" \
            roombooking

          # curl prints 000 itself when it cannot connect, so `|| true` (not
          # `|| echo 000`, which would concatenate into 000000) keeps the value
          # readable while stopping `set -e` from aborting the step.
          echo "Waiting for service to start..."
          READY=""
          for i in $(seq 1 40); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/book || true)
            case "$CODE" in
              ""|000) ;;
              *) READY="$CODE"; break ;;
            esac
            sleep 2
          done

          if [ -z "$READY" ]; then
            echo "::error::Service never became reachable on port 8080."
            echo "----- container logs -----"
            docker logs booking-service
            exit 1
          fi
          echo "Service is up (probe returned HTTP $READY)."

          echo "Triggering booking process..."
          RESPONSE=$(curl -sS --max-time 900 -X POST http://localhost:8080/api/v1/book || true)
          echo "Booking Response: $RESPONSE"

          # The service prefixes its reply with a status token. Only FAILED means
          # something is broken; a room that is simply taken is a normal outcome.
          case "$RESPONSE" in
            SUCCESS:*)
              echo "Booked successfully."
              ;;
            SKIPPED:*)
              echo "Nothing scheduled for the target date."
              ;;
            UNAVAILABLE:*)
              echo "::notice::Scheduled window already taken - no booking made."
              ;;
            FAILED:*)
              echo "::error::$RESPONSE"
              echo "----- container logs -----"
              docker logs booking-service
              exit 1
              ;;
            *)
              echo "::error::Unrecognised response from booking service."
              echo "----- container logs -----"
              docker logs booking-service
              exit 1
              ;;
          esac
