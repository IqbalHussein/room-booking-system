name: Nightly Room Booking

on:
  schedule:
    # Mon/Wed/Fri: book 2:30–5:30 PM EDT → run at 17:30 UTC (1:30 PM EDT) to be ready
    - cron: '30 17 * * 1'
    - cron: '30 17 * * 3'
    - cron: '30 17 * * 5'
    # Tuesday: book 8:30–11:30 AM EDT → run at 11:30 UTC (7:30 AM EDT) to be ready
    - cron: '30 11 * * 2'
    # Thursday: book 4:00–7:00 PM EDT → run at 19:00 UTC (3:00 PM EDT) to be ready
    - cron: '00 19 * * 4'
  workflow_dispatch:
    # Allows manual trigger from GitHub UI

jobs:
  book-room:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t roombooking .

      - name: Run Container & Trigger Booking
        env:
          BOOKING_USERNAME: ${{ secrets.BOOKING_USERNAME }}
          BOOKING_PASSWORD: ${{ secrets.BOOKING_PASSWORD }}
        run: |
          # Start container in background
          docker run -d --name booking-service \
            -p 8080:8080 \
            -e BOOKING_USERNAME="$BOOKING_USERNAME" \
            -e BOOKING_PASSWORD="$BOOKING_PASSWORD" \
            roombooking

          # Wait for Spring Boot to start (health check loop)
          echo "Waiting for service to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/api/v1/book > /dev/null; then
              echo "Service is up!"
              break
            fi
            echo "Waiting..."
            sleep 2
          done

          # Trigger the booking
          echo "Triggering booking process..."
          RESPONSE=$(curl -X POST http://localhost:8080/api/v1/book)
          
          echo "Booking Response: $RESPONSE"
          
          # Check for success
          if [[ "$RESPONSE" == *"Success"* ]]; then
            echo "Booking completed successfully."
          else
            echo "Booking failed or returned unexpected response."
            docker logs booking-service
            exit 1
          fi
